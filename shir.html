<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انواع شیرآلات | لوِنتا</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header>
    <h1>LEVANTA | لوِنتا</h1>
    <p>فروشگاه تجهیزات حمام و سرویس بهداشتی</p>
</header>

<main class="products-page">

   <h2>انواع شیرآلات</h2>
    <p>مشاهده مدل‌های مختلف انواع شیرآلات</p>

    <div class="product-list">

      <div class="product-card" data-price="2500000">
        <img src="images/toch5.jpg" alt="روشویی مدل سوم">
        <h3> مدل چيني كرد كانسپت </h3>
        <p>اصالت و زیبایی</p>
        <div class="buy-box">
            <div class="quantity">
              <button class="minus">−</button>
              <span class="qty">1</span>
              <button class="plus">+</button>
            </div>
          
            <button class="add-cart">
              افزودن به سبد خرید 
              <i class="fa-solid fa-cart-shopping"></i>
            </button>
          </div>

        </div>

    </div>

    <a href="index.html" class="back-home">بازگشت به صفحه اصلی</a>

</main>
<script src="script.js"></script>

</html>
